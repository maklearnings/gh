name: Variable Usage

on:
  push:

env:
  CONTAINER_REGISTRY: docker.io
  DOCKER_USERNAME: makesh
  IMAGE_NAME: github-actions-nginx

jobs:

  
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker build
        run: echo docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/$IMAGE_NAME:latest 
    
      - name: Docker login
        env:
          DOCKER_PASSWORD: securepassword
        run: echo docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD

      - name: Docker publish
        run: echo docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
  Deploy:
    env: 
      CONTAINER_REGISTRY: docker.io
      DOCKER_USERNAME: makesh
      IMAGE_NAME: github-actions-nginx
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker run
        run: echo docker run -d -p 80:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

           
        
      